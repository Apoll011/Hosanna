# flutter pub run flutter_launcher_icons
#
# Android 8+ launchers (esp. Samsung One UI on phones) pad legacy mipmaps into
# the adaptive safe-zone, which makes the logo look ~25–30% smaller. Adaptive
# layers below keep the mark full-bleed like on tablets that still show the
# raw bitmap.
flutter_launcher_icons:
  image_path: "assets/logo.png"

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  # Middle ground: 0 was cropped/zoomed on phone masks; default 16 looked
  # ~30% too small. ~10 keeps the mark large without clipping pegs/neck.
  adaptive_icon_foreground_inset: 10

  ios: true
  remove_alpha_ios: true

  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
